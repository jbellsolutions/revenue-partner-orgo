# Model chain on OpenRouter. Primary GLM 5.2, then DeepSeek V4 Pro, then
# GPT-5.6 Luna, then MiniMax M3. `fallback_providers` is Hermes's primary source
# of truth for the chain and is walked in order when the one above it errors or
# raises AuthError.
#
# NOTE: the requested `deepseek-v4-pro-0423` does not exist on OpenRouter. The
# only dated V4 Pro build is `-0813`; the undated id below tracks current and is
# used so the chain cannot break on a snapshot that was never published.
model:
  default: z-ai/glm-5.2
  provider: openrouter

fallback_providers:
  - provider: custom
    model: deepseek/deepseek-v4-pro
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
  - provider: custom
    model: openai/gpt-5.6-luna
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
  - provider: custom
    model: minimax/minimax-m3
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
providers:
  vercel-ai-gateway:
    name: Vercel AI Gateway
    base_url: https://ai-gateway.vercel.sh/v1
    key_env: AI_GATEWAY_API_KEY
    transport: chat_completions
    default_model: meta/muse-spark-1.1
  meta-model-api:
    name: Meta Model API
    api: https://api.meta.ai/v1
    key_env: MODEL_API_KEY
    transport: codex_responses
    default_model: muse-spark-1.1
    context_length: 1048576
agent:
  max_turns: 60
  service_tier: fast
  verify_on_stop: false
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  # Enable provider: honcho only after its authentication step succeeds;
  # a credential-less honcho boot is unvalidated, so the bake ships it off.
  provider: ''
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 15
approvals:
  mode: manual
  mcp_reload_confirm: true
  destructive_slash_confirm: true
hooks_auto_accept: false
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
secrets:
  onepassword:
    # Ships DISABLED: with no op account, `op read` prompts on /dev/tty, so an
    # enabled-but-tokenless map stalls every interactive `hermes` start ~30s
    # per reference (field-tested on 0.2.1). Onboarding / on_resume flip this
    # to true (revenue-partner-op-enable) the moment OP_SERVICE_ACCOUNT_TOKEN
    # lands in ~/.hermes/.op.env; until then this integration stays disabled.
    enabled: false
    env:
      LATITUDE_API_KEY: op://Hermes/Hermes Agent Secrets/LATITUDE_API_KEY

      TELEGRAM_BOT_TOKEN: op://Hermes/Hermes Agent Secrets/TELEGRAM_BOT_TOKEN
      XAI_API_KEY: op://Hermes/Hermes Agent Secrets/XAI_API_KEY
      OPENROUTER_API_KEY: op://Hermes/Hermes Agent Secrets/OPENROUTER_API_KEY
      AI_GATEWAY_API_KEY: op://Hermes/Hermes Agent Secrets/VERCEL_AI_GATEWAY_API_KEY
      MODEL_API_KEY: op://Hermes/Hermes Agent Secrets/META_API_KEY

    binary_path: /usr/bin/op
_config_version: 33
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
# Slack is an operator-connected inbound channel. Scopes are granted in the
# Slack app manifest; what the agent may DO when reached over Slack is bounded
# by platform_toolsets below, not by the Slack scopes.
platforms:
  slack:
    enabled: true
    # Keep every reply chunk attached to the thread the operator started, so a
    # long multi-part answer stays one conversation instead of spraying the
    # channel. `first` (the default) only threads the opening chunk.
    reply_to_mode: all
    extra:
      # Reply inside a thread on the operator's message. This is the library
      # default, declared explicitly so a future default flip cannot silently
      # change the channel's behaviour.
      reply_in_thread: true
  telegram:
    # No bot token is provisioned. Enabling it makes the gateway retry every 60s
    # and log an error each time; first-boot QR onboarding flips this on.
    enabled: false

platform_toolsets:
  # Local/driven path (rp, hermes). Reached only via the authenticated Orgo API.
  # Deliberately excludes terminal, code_execution, delegation, computer_use, and
  # the built-in browser/web tools. Web reads go through browser-box/data-box;
  # every web WRITE routes through Super Browser's policy layer, never around it.
  cli:
    - session_search
    - super-browser
    - browser-box
    - data-box
    - scrape-creators
    - skills
    - memory
    - file
    - todo
  telegram: &revenue_partner_readonly_toolsets
    - session_search
  discord: *revenue_partner_readonly_toolsets
  whatsapp: *revenue_partner_readonly_toolsets
  # Slack is a full operator channel by explicit choice: the workspace is
  # trusted, so any member can drive the agent. It carries the same working set
  # as `cli` and the same exclusions -- no terminal, code_execution, delegation
  # or computer_use, and no built-in browser/web tools, so every web write still
  # routes through Super Browser's policy layer.
  slack:
    - session_search
    - super-browser
    - browser-box
    - data-box
    - scrape-creators
    - skills
    - memory
    - file
    - todo
  signal: *revenue_partner_readonly_toolsets
  homeassistant: *revenue_partner_readonly_toolsets
  qqbot: *revenue_partner_readonly_toolsets
  yuanbao: *revenue_partner_readonly_toolsets
  teams: *revenue_partner_readonly_toolsets
  google_chat: *revenue_partner_readonly_toolsets
plugins:
  enabled:
    - anthropic-provider
    - latitude
    - openai
    - openai-codex
    - openai-codex-provider
    - openrouter
    - openrouter-provider
    - xai
    - xai-provider
  disabled:
    - browser-browser-use
    - browser-firecrawl
    - web-exa
    - web-xai
    - web/firecrawl
    - novita-provider
  entries: {}
mcp_servers:
  # Hosted Super Browser. ATTACH BY URL — never vendor a local copy. The tools,
  # all providers, and the approval lifecycle run on the server. Vendoring a copy
  # also meant installing a second dependency lock into this venv, which silently
  # rewrote six of the agent's own pins (see docs/VERIFICATION.md).
  super-browser:
    url: ${SUPER_BROWSER_URL}/mcp
    headers:
      Authorization: Bearer ${SUPER_BROWSER_TOKEN}
    enabled: true
    connect_timeout: 30.0
    tool_timeout: 300.0
    # KNOWN COSMETIC ISSUE: the gateway logs "keepalive failed ... Unsupported
    # method: ping" every 180s and reconnects. Tools keep working throughout --
    # the agent lists and calls all 24 Super Browser tools -- so this is log
    # noise, not an outage.
    #
    # Upstream super-browser 4ba5195 fixed bare JSON-RPC ping (verified live:
    # returns an empty result, and unknown methods now return -32601). Hermes's
    # session-attached keepalive still fails, so a second dispatch path is
    # involved that the bare-POST fix does not reach.
    #
    # `keepalive_interval` is deliberately NOT set here: Hermes reads it from
    # its own server-config dict and the value does not survive config.yaml, so
    # the cadence stays pinned at the 180s default. Setting it looks like a fix
    # and silently is not.

  # browser-box and data-box: the successors to Super Browser, run by the operator
  # (see github.com/jbellsolutions/box-kit), attached by URL like Super Browser.
  #
  # browser-box is limited to its READ tools here. fetch/read/session/status
  # cannot post, send or buy; external writes (posting, DMs, form submissions)
  # stay on Super Browser's approval lifecycle until a reviewed write path
  # exists. `tools.include` pins that set, so tools the server adds later
  # (act, task, computer) are NOT enabled by accident.
  #
  # BROWSER_BOX_URL and DATABOX_URL are the FULL MCP endpoints, ending in /mcp,
  # exactly as box-kit's `make env` prints them (https://your-box.example.com/mcp).
  browser-box:
    url: ${BROWSER_BOX_URL}
    headers:
      Authorization: Bearer ${BROWSER_BOX_TOKEN}
    enabled: true
    connect_timeout: 60
    tool_timeout: 300.0
    tools:
      include: [fetch, read, session, status]

  # data-box: page data (scrape) and its job ledger. The free fetch runs at once;
  # a paid rung never runs without approval. data-box's `plan`, `execute` and
  # `sources` (priced lead pulls through paid providers) are left out on purpose:
  # this agent has no human approval step for them yet.
  data-box:
    url: ${DATABOX_URL}
    headers:
      Authorization: Bearer ${DATABOX_TOKEN}
    enabled: true
    connect_timeout: 60
    tool_timeout: 120.0
    tools:
      include: [status, scrape, job]

  # Scrape Creators — vendor DATA PLANE. 180 public routes across TikTok,
  # Instagram, YouTube, LinkedIn, Facebook, Reddit and Threads plus the Facebook,
  # Google and TikTok ad libraries. Public data only: no login, no cookies, no
  # authenticated profile.
  #
  # This is the lower half of a two-plane architecture. The CONTROL PLANE is the
  # owned `lead-mining-posting` MCP, which wraps this provider behind ten typed
  # tools with provenance, dedupe and qualification boundaries, and keeps the
  # provider interchangeable. Lead work belongs there; this entry is for the
  # cases that genuinely need a specific provider endpoint.
  #
  # The control plane is NOT yet attached: its repo documents a seven-step
  # deployment gate (authenticated HTTPS, 0700 dirs, health checks, budgets,
  # audit logs, durable artifacts) before it becomes a shared endpoint, and
  # "do not expose an unauthenticated MCP port directly to the Internet".
  scrape-creators:
    url: https://api.scrapecreators.com/mcp
    headers:
      x-api-key: ${SCRAPECREATORS_API_KEY}
    enabled: true
    connect_timeout: 30.0
    tool_timeout: 300.0
image_gen:
  provider: openai-codex
  openai-codex:
    model: gpt-image-2-medium
  xai:
    model: grok-imagine-image-quality

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
