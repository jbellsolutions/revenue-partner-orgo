name: Shared onboarding
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r onboarding/tests/requirements.txt
      - name: Fetch exact Hermes adapter contract
        run: |
          git init "$RUNNER_TEMP/hermes-contract"
          git -C "$RUNNER_TEMP/hermes-contract" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-contract" fetch --depth 1 origin 939e45c91d751fadd94dcd1b873ac3cb44846213
          git -C "$RUNNER_TEMP/hermes-contract" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hermes-contract" rev-parse HEAD)" = 939e45c91d751fadd94dcd1b873ac3cb44846213
      - name: Verify release consistency
        run: python scripts/sync-onboarding.py --check
      - name: Exercise setup, real adapter classes, delivery and privacy
        env:
          HERMES_SOURCE: ${{ runner.temp }}/hermes-contract
        run: python -m unittest discover -s onboarding/tests -v
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the same suite inside the reviewed runtime image
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python \
            -e HERMES_SOURCE=/opt/hermes -e HERMES_HOME=/tmp/orgo-contract-home \
            -v "$PWD:/workspace:ro" -w /workspace \
            nousresearch/hermes-agent:v2026.9.11@sha256:9469b3e78b9545b6d576eb8887a95352e9a0ea83730eaf31431cf862ca1010e1 \
            -m unittest discover -s onboarding/tests -v
