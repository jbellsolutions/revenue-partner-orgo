name: Legacy custom-template verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run canonical release verification
        env:
          REVENUE_PARTNER_VERIFY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: bash .github/scripts/verify_release
