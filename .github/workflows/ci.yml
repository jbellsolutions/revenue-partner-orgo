name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r onboarding/tests/requirements.txt
      - run: python -m unittest discover -s tests -p test_current_install.py -v
      - run: python -m unittest discover -s tests -p test_orgo_identity.py -v
      - run: python .github/scripts/check_candidate_yaml.py
      - run: python .github/scripts/check_candidate_credentials.py
      - run: python .github/scripts/check_markdown_links.py
      - run: python .github/scripts/check_shell_syntax.py
      - run: python -m compileall -q onboarding orgo
